plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ---- Built-in AI provider (zero-setup for end users) ----
// Injected at BUILD TIME, never stored in source code:
//  • CI: GitHub Actions secrets BUILTIN_AI_KEY / BUILTIN_AI_BASE / BUILTIN_AI_MODEL
//  • Local: local.properties keys builtinAiKey / builtinAiBase / builtinAiModel (gitignored)
// Rotate the key any time: update the secret and rebuild — no code change needed.
def localProps = new Properties()
def lpFile = rootProject.file("local.properties")
if (lpFile.exists()) lpFile.withInputStream { localProps.load(it) }

def builtinKey   = System.getenv("BUILTIN_AI_KEY")   ?: (localProps.getProperty("builtinAiKey")   ?: "")
def builtinBase  = System.getenv("BUILTIN_AI_BASE")  ?: (localProps.getProperty("builtinAiBase")  ?: "https://api.groq.com/openai/v1/chat/completions")
def builtinModel = System.getenv("BUILTIN_AI_MODEL") ?: (localProps.getProperty("builtinAiModel") ?: "meta-llama/llama-4-scout-17b-16e-instruct")

android {
    namespace 'com.rootgenie.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.rootgenie.app"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "0.2.0"

        buildConfigField "String", "BUILTIN_AI_KEY",   "\"${builtinKey}\""
        buildConfigField "String", "BUILTIN_AI_BASE",  "\"${builtinBase}\""
        buildConfigField "String", "BUILTIN_AI_MODEL", "\"${builtinModel}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.topjohnwu.libsu:core:5.2.2'
    implementation 'com.github.topjohnwu.libsu:service:5.2.2'
}
